name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - main  # This means deploy when you push to the `main` branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the code from GitHub
      - name: Checkout code
        uses: actions/checkout@v2

      # 2. Set up Google Cloud SDK
      - name: Set up Google Cloud
        uses: google-github-actions/setup-gcloud@v0.7.0
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          credentials_json: ${{ secrets.GOOGLE_CLOUD_KEY }}

      # 3. Build Docker image
      - name: Build Docker image
        run: docker build -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/flask-app .

      # 4. Push Docker image to Google Container Registry
      - name: Push Docker image
        run: docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/flask-app

      # 5. Deploy to Google Cloud Run
      - name: Deploy to Google Cloud Run
        run: |
          gcloud run deploy flask-app \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/flask-app \
            --platform managed \
            --region us-central1 \
            --allow-unauthenticated
