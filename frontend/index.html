<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>University Support Platform</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>University Support Platform</h1>

  <!-- Submit Inquiry Section -->
  <section>
    <h2>Submit Inquiry</h2>
    <form id="inquiry-form">
      <label for="student-name">Student Name:</label>
      <input type="text" id="student-name" required>
      
      <label for="inquiry-message">Message:</label>
      <textarea id="inquiry-message" required></textarea>
      
      <button type="submit">Submit Inquiry</button>
    </form>
    <p id="inquiry-response"></p>
  </section>

  <!-- View All Requests Section -->
  <section>
    <h2>View All Requests</h2>
    <button id="view-requests">Load Requests</button>
    <ul id="requests-list"></ul>
  </section>

  <script src="script.js"></script>
</body>
</html>
